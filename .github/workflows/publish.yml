name: Publish

# Collects the packages the app repositories have published into the shared
# remote. Nothing is built here: the apps are built, tested and signed once,
# by their own repositories.
on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REPO_URL: ${{ vars.FLATPAK_REPO_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}

jobs:
  publish:
    runs-on: ubuntu-24.04
    container:
      # Only for flatpak, ostree and gpg; no SDK is used.
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
    defaults:
      run:
        shell: bash
    outputs:
      deploy: ${{ steps.deploy.outputs.deploy }}
      stable: ${{ steps.version.outputs.stable }}
      publish: ${{ steps.publication.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Classify the version tag
        id: version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          stable=false
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9]+)?$ ]]; then
            stable=true
          fi
          echo "stable=$stable" >> "$GITHUB_OUTPUT"

      - name: Decide whether to publish
        id: publication
        env:
          PUBLISH: >-
            ${{ vars.PUBLISH_FLATPAK == 'true' &&
                ((startsWith(github.ref, 'refs/tags/v') && steps.version.outputs.stable == 'true') ||
                 (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) }}
        run: |
          echo "PUBLISH=$PUBLISH" >> "$GITHUB_ENV"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"

      - name: Test collection and release behavior
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Download the apps' published packages
        run: python3 scripts/compose.py fetch "$RUNNER_TEMP/work"

      - name: Import the signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          if [[ "$PUBLISH" == true ]]; then
            if [[ -z "$GPG_PRIVATE_KEY" ]]; then
              echo 'Set FLATPAK_GPG_PRIVATE_KEY before enabling PUBLISH_FLATPAK.' >&2
              exit 1
            fi
            printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import
          else
            # Runs that don't publish sign with a throwaway key and start a
            # new repository, to test everything up to the upload.
            gpg --batch --pinentry-mode loopback --passphrase '' \
              --quick-generate-key 'Throwaway test key' ed25519 sign 1d
          fi
          key=$(gpg --batch --list-secret-keys --with-colons | awk -F: '$1 == "fpr" && !key { key = $10 } END { print key }')
          test -n "$key"
          gpg --batch --export --export-options export-minimal "$key" > "$RUNNER_TEMP/signing-key.gpg"
          test -s "$RUNNER_TEMP/signing-key.gpg"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          echo "GPG_KEY=$key" >> "$GITHUB_ENV"

      - name: Sign and prepare the shared repository
        env:
          # The published history is signed with the real key, so runs with
          # the throwaway key start a new repository.
          KEEP_HISTORY: ${{ env.PUBLISH == 'true' && vars.FLATPAK_KEEP_HISTORY != 'false' }}
        run: python3 scripts/compose.py publish "$RUNNER_TEMP/work"

      # A client that only knows the public key must accept the summary,
      # every app and extension, and the catalog of every architecture.
      - name: Verify the signed repository
        run: python3 scripts/compose.py verify signed-repo "$RUNNER_TEMP/signing-key.gpg"

      - name: Remove the imported key
        if: always()
        run: |
          if [[ -d "$RUNNER_TEMP/gnupg" ]]; then
            GNUPGHOME="$RUNNER_TEMP/gnupg" gpgconf --kill all || true
            rm -rf "$RUNNER_TEMP/gnupg"
          fi

      - name: Check the GitHub Pages size limit
        run: |
          size=$(du -sb signed-repo | cut -f1)
          echo "Repository size: $(( size / 1000000 )) MB"
          if (( size >= 1000000000 )); then
            echo 'The repository exceeds the 1 GB GitHub Pages limit; lower HISTORY_DEPTH or use another host.' >&2
            exit 1
          fi

      - name: Package the verified repository and installer files
        run: |
          mkdir release-assets
          tar -czf release-assets/nosini-repository.tar.gz -C signed-repo .
          cp signed-repo/nosini.flatpakrepo signed-repo/*.flatpakref \
            signed-repo/sources.json "$RUNNER_TEMP/signing-key.gpg" release-assets/
          (cd release-assets && sha256sum ./* > SHA256SUMS)

      - uses: actions/upload-artifact@v7
        with:
          name: nosini-release
          path: release-assets
          if-no-files-found: error

      - name: Decide whether to deploy
        id: deploy
        if: env.PUBLISH == 'true'
        run: echo 'deploy=true' >> "$GITHUB_OUTPUT"

      - uses: actions/upload-pages-artifact@v5
        if: steps.deploy.outputs.deploy == 'true'
        with:
          path: signed-repo

  deploy:
    needs: publish
    if: needs.publish.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  release:
    needs: [publish, deploy]
    if: >-
      ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') &&
          needs.publish.result == 'success' &&
          ((needs.publish.outputs.publish == 'true' && needs.deploy.result == 'success') ||
           (needs.publish.outputs.publish == 'false' && needs.deploy.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      STABLE: ${{ needs.publish.outputs.stable }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: nosini-release
          path: release-assets

      - name: Create the release and upload the verified artifacts
        shell: bash
        run: |
          assets=(release-assets/*)
          test -f "${assets[0]}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            if [[ "$STABLE" != true ]]; then
              gh release edit "$TAG" --prerelease --latest=false
            fi
            gh release upload "$TAG" "${assets[@]}" --clobber
            gh release edit "$TAG" --draft=false
          else
            options=(--verify-tag --title "Nosini Flatpaks ${TAG#v}" --generate-notes)
            if [[ "$STABLE" != true ]]; then
              options+=(--prerelease --latest=false)
            fi
            gh release create "$TAG" "${assets[@]}" "${options[@]}"
          fi
