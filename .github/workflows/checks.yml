name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Lint workflows
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12 "$RUNNER_TEMP"
          "$RUNNER_TEMP/actionlint" -color

  compose:
    runs-on: ubuntu-24.04
    container:
      # The image the publish job uses, with flatpak, ostree and gpg.
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Test collection and release behavior
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
